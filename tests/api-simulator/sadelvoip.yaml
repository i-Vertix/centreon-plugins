simlet: sadelvoip

# -------------------
# REQUEST DEFINITIONS
# -------------------
request:
  - method: GET
    uriPath: /api/v1/version

  - method: GET
    uriPath: /api/v1/ping


responses:

  # -------------------
  # VERSION
  # -------------------
  - when:
      request:
        - where: uriPath
          equals: /api/v1/version
        - where: header
          named: apikey
          equals: "1234"

    from: stub
    status: 200
    body: |
      {
        "version": "1.2.6"
      }

  # -------------------
  # PING
  # -------------------
  - when:
      request:
        - where: uriPath
          equals: /api/v1/ping
        - where: header
          named: apikey
          equals: "1234"

    from: stub
    status: 200
    body: |
      {
        "timestamp": "2026-06-03T08:36:56.957Z",
        "macAddress": "00:07:32:b9:0e:9b",
        "dbConnection": 1
      }

  # -------------------
  # RESTRICTED
  # -------------------
  - when:
      request:
        - where: header
          named: apikey
          equals: "restricted"

    from: stub
    status: 403
    body: |
      {
        "message": "User has no access to this method."
      }

  # -------------------
  # INVALID KEY
  # -------------------
  - when:
      request:
        - where: header
          named: apikey
          not equals: "1234"

    from: stub
    status: 401
    body: |
      {
        "message": "Invalid API key."
      }

  # -------------------
  # FALLBACK
  # -------------------
  - from: stub
    status: 404