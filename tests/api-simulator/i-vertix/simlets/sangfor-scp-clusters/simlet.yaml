simlet: sangfor-scp-clusters

# Sangfor SCP: clusters
# plugin options: --hostname=i-vertix-simulation-vm --port=6090 --proto=http and either
#   --access-key=sangfor-monitoring --secret-key=<any> (EC2, the signature is not verified)
#   or --api-username=monitoring --api-password=<any> (token auth v2, the password is not verified)
# both send an Authorization header containing "sangfor-monitoring"

request:
  - method: GET
  - uriPath: /janus/20180725/clusters

responses:

  # clusters of the resource pool pool-lab
  - when:
      request:
        - where: uriPath
          equals: /janus/20180725/clusters

        - where: header
          named: Authorization
          contains: "sangfor-monitoring"

        - where: uriQueryParameter
          named: "az_id"
          equals: "a1b2c3d4-0000-4000-8000-000000000002"

    from: stub
    status: 200

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "",
        "code": 0,
        "data": {
          "total_size": 1,
          "page_num": 0,
          "page_size": 100,
          "next_page_num": "",
          "data": [
            {
              "status": "master_offline",
              "authorize_mode": "platform",
              "name": "cluster-lab",
              "project_ids": [],
              "storage": {
                "total_mb": 3899436.0,
                "used_mb": 2945566.0,
                "ratio": 0.76
              },
              "cpu": {
                "total_mhz": 95788.28,
                "ratio": 0.46,
                "used_mhz": 44062.61
              },
              "version": "6.7.0",
