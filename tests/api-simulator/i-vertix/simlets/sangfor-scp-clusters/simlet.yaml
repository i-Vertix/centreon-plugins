              "az_id": "a1b2c3d4-0000-4000-8000-000000000002",
              "description": ""
            }
          ]
        }
      }

  # default
  - when:
      request:
        - where: uriPath
          equals: /janus/20180725/clusters

        - where: header
          named: Authorization
          contains: "sangfor-monitoring"

    from: stub
    status: 200

    headers:
      - name: Content-Type
