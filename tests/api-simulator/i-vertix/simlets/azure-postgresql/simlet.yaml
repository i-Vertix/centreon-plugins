simlet: azure-postgresql

request:
  - method: GET
  - uriPath: /azure/management/postgresql/subscriptions/subscription-ivertix/resources

responses:

  - when:
      request:
        - where: header
          named: Authorization
          equals: "Bearer token-123"
        - where: uriQueryParameter
          named: "api-version"
          equals: "2018-01-01"

    from: stub
    status: 200
    body: |
      {
        "value": [
          {
            "id": "/subscriptions/subscription-ivertix/resourceGroups/rg-iv-1/providers/Microsoft.DBforPostgreSQL/flexibleServers/postgres-flex-prod-1",
            "name": "postgres-flex-prod-1",
            "type": "Microsoft.DBforPostgreSQL/flexibleServers",
            "sku": {
              "name": "Standard_D4ds_v5",
              "tier": "GeneralPurpose"
            },
            "location": "northeurope",
            "tags": {}
          }
        ]
      }
