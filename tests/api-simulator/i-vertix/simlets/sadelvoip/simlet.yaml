simlet: sadelvoip

# -------------------
# REQUEST DEFINITIONS
# -------------------
# only the method was evaluated in the former per-path list, so this simlet caught every GET request;
# the single paths are matched in the responses below
request:
  - method: GET
  - where: uriPath
    contains: /sadelvoip/api/v1/


responses:

  # -------------------
  # VERSION
  # -------------------
  - when:
      request:
        - where: uriPath
          equals: /sadelvoip/api/v1/version
        - where: header
          named: apikey
          equals: "1234"

    from: stub
    status: 200
    body: |
      {
        "version": "1.2.6"
      }

  # -------------------
  # PING
  # -------------------
  - when:
      request:
        - where: uriPath
          equals: /sadelvoip/api/v1/ping
        - where: header
          named: apikey
          equals: "1234"

    from: stub
    status: 200
    body: |
      {
        "timestamp": "2026-06-03T08:36:56.957Z",
        "macAddress": "00:07:32:b9:0e:9b",
        "dbConnection": 1
      }

  # -------------------
  # CONSOLES
  # -------------------
  - when:
      request:
        - where: uriPath
          equals: /sadelvoip/api/v1/diagnostic/consoles
        - where: header
          named: apikey
          equals: "1234"

