simlet: velocloud-enterprise-edge-link-metrics

request:
  - method: POST
  - uriPath: /velocloud/portal/rest/metrics/getEdgeLinkMetrics

responses:

  - when:
      request:
        - where: header
          named: Content-Type
          equals: "application/json"
        - where: header
          named: Cookie
          equals: "velocloud.session=cookie123"
        - where: body
          contains: enterpriseId
        - where: body
          contains: metrics
        - where: body
          contains: edgeId
        - where: body
          contains: interval

