simlet: sangfor-scp-azs

# Sangfor SCP: resource pools
# plugin options: --hostname=i-vertix-simulation-vm --port=6090 --proto=http and either
#   --access-key=sangfor-monitoring --secret-key=<any> (EC2, the signature is not verified)
#   or --api-username=monitoring --api-password=<any> (token auth v2, the password is not verified)
# both send an Authorization header containing "sangfor-monitoring"

request:
  - method: GET
  - uriPath: /janus/20180725/azs

responses:

  - when:
      request:
        - where: uriPath
          equals: /janus/20180725/azs

        - where: header
          named: Authorization
          contains: "sangfor-monitoring"

    from: stub
    status: 200

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "",
        "code": 0,
        "data": [
          {
            "status": "normal",
            "description": "",
            "tag": "private",
            "version": "6.9.0",
            "type": "hci",
            "id": "a1b2c3d4-0000-4000-8000-000000000001",
            "name": "pool-prod"
          },
          {
            "status": "offline",
            "description": "",
            "tag": "public",
            "version": "6.8.0",
            "type": "hci",
            "id": "a1b2c3d4-0000-4000-8000-000000000002",
            "name": "pool-lab"
          }
        ]
      }

  # FALLBACK: missing or unknown credentials
  - from: stub
    status: 401

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "Unauthorized",
        "code": 401,
        "data": {}
      }
