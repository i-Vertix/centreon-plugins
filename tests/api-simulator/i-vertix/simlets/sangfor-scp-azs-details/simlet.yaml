simlet: sangfor-scp-azs-details

# Sangfor SCP: resource pool details (physical resources)
# plugin options: --hostname=i-vertix-simulation-vm --port=6090 --proto=http and either
#   --access-key=sangfor-monitoring --secret-key=<any> (EC2, the signature is not verified)
#   or --api-username=monitoring --api-password=<any> (token auth v2, the password is not verified)
# both send an Authorization header containing "sangfor-monitoring"

request:
  - method: GET
  - where: uriPath
    contains: /janus/20180725/azs/

responses:

  # pool-prod
  - when:
      request:
        - where: uriPath
          equals: /janus/20180725/azs/a1b2c3d4-0000-4000-8000-000000000001

        - where: header
          named: Authorization
          contains: "sangfor-monitoring"

    from: stub
    status: 200

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "",
        "code": 0,
        "data": {
          "status": "normal",
          "description": "",
          "tag": "private",
          "version": "6.9.0",
          "type": "hci",
          "id": "a1b2c3d4-0000-4000-8000-000000000001",
          "name": "pool-prod",
          "physical_resources": [
            {
              "unit": "mb",
              "total": 3133440.0,
              "name": "storage",
              "used": 173357.0
            },
            {
              "unit": "mhz",
              "total": 105355.97,
              "name": "cpu",
              "used": 27743.74
            },
            {
              "unit": "mb",
              "total": 98304.0,
              "name": "memory",
              "used": 46717.49
            },
            {
              "unit": "",
              "total": 0,
              "name": "gpu",
              "used": 0.0
            },
            {
              "unit": "mb",
              "total": 0,
              "name": "gpu_mem",
              "used": 0
            }
          ],
          "virtual_resources": [
            {
              "name": "cpu",
              "limit": -1,
              "allocated": 274,
              "total": 30.0,
              "occupied": 89,
              "unit": "Core"
            }
          ]
        }
      }

  # pool-lab
  - when:
      request:
        - where: uriPath
          equals: /janus/20180725/azs/a1b2c3d4-0000-4000-8000-000000000002

        - where: header
          named: Authorization
          contains: "sangfor-monitoring"

    from: stub
    status: 200

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "",
        "code": 0,
        "data": {
          "status": "offline",
          "description": "",
          "tag": "public",
          "version": "6.8.0",
          "type": "hci",
          "id": "a1b2c3d4-0000-4000-8000-000000000002",
          "name": "pool-lab",
          "physical_resources": [
            {
              "unit": "mb",
              "total": 2854884.0,
              "name": "storage",
              "used": 156326.0
            },
            {
              "unit": "mhz",
              "total": 62253.72,
              "name": "cpu",
              "used": 29051.74
            },
            {
              "unit": "mb",
              "total": 122880.0,
              "name": "memory",
              "used": 50054.02
            },
            {
              "unit": "",
              "total": 0,
              "name": "gpu",
              "used": 0.0
            },
            {
              "unit": "mb",
              "total": 0,
              "name": "gpu_mem",
              "used": 0
            }
          ],
          "virtual_resources": []
        }
      }

  # FALLBACK: unknown resource
  - from: stub
    status: 404

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "Resource not found",
        "code": 404,
        "data": {}
      }
