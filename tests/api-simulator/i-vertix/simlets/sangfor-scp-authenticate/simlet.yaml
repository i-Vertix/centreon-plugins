simlet: sangfor-scp-authenticate

# Sangfor SCP: token authentication (v2)
# plugin options: --hostname=i-vertix-simulation-vm --port=6090 --proto=http and either
#   --access-key=sangfor-monitoring --secret-key=<any> (EC2, the signature is not verified)
#   or --api-username=monitoring --api-password=<any> (token auth v2, the password is not verified)
# both send an Authorization header containing "sangfor-monitoring"

request:
  - method: POST
  - uriPath: /janus/v2/authenticate

responses:

  - when:
      request:
        - where: uriPath
          equals: /janus/v2/authenticate

        - where: body
          contains: '"username":"monitoring"'

    from: stub
    status: 200

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "",
        "code": 0,
        "data": {
          "access": {
            "token": {
              "issued_at": "2026-10-31T06:31:41.000000Z",
              "expires": "2099-01-01T00:00:00.000000Z",
              "id": "sangfor-monitoring-token",
              "tenant": {
                "id": "cf92f8d651c24ed6938b186e252ee0bc",
                "enabled": true,
                "description": "",
                "name": "admin"
              },
              "audit_ids": []
            },
            "user": {
              "username": "monitoring",
              "roles_links": [],
              "name": "monitoring",
              "roles": [
                {
                  "name": "admin"
                }
              ],
              "id": "349c19d7653349e1a8918326aacb4430"
            }
          }
        }
      }

  # FALLBACK: missing or unknown credentials
  - from: stub
    status: 401

    headers:
      - name: Content-Type
        value: application/json

    body: |
      {
        "message": "Unauthorized",
        "code": 401,
        "data": {}
      }
