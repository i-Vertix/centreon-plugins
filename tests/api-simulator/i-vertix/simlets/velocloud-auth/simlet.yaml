simlet: velocloud-auth

request:
  - method: POST
  - uriPath: /velocloud/portal/rest/login/operatorLogin

responses:

  - when:
      request:
        - where: uriPath
          equals: /velocloud/portal/rest/login/operatorLogin

        - where: body
          contains: password

        - where: body
          contains: username

    from: stub
    status: 200

    headers:
      - "Set-Cookie: velocloud.session=cookie123; Path=/; HttpOnly; Secure; SameSite=Strict"
